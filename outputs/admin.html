<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar vacantes · Brújula</title><style>body{font:15px system-ui;background:#f4f6f2;color:#193027;margin:0}.box{max-width:760px;margin:7vh auto;background:white;border:1px solid #e2e8e1;border-radius:16px;padding:28px;box-shadow:0 12px 35px #1833260c}h1{margin:0 0 8px;font-size:25px}p{color:#64736a;line-height:1.55}label{font-weight:650;display:block;margin:18px 0 7px}input,textarea{box-sizing:border-box;width:100%;border:1px solid #dce4dc;border-radius:9px;padding:12px;font:14px system-ui}textarea{min-height:280px;font:13px ui-monospace,monospace}button{background:#176c4c;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:14px}.msg{margin-top:15px;padding:12px;border-radius:8px;display:none}.ok{display:block;background:#e5f3eb;color:#176c4c}.err{display:block;background:#ffefed;color:#a3423c}.hint{font-size:13px}</style><main class="box"><div style="color:#176c4c;font-weight:700">BRÚJULA · ADMINISTRACIÓN</div><h1>Cargar vacantes</h1><p>Pega una vacante JSON o un arreglo de vacantes. Si coincide el título, empresa y ubicación con una existente, se actualiza en vez de duplicarse.</p><label for="key">Clave de administración</label><input id="key" type="password" autocomplete="current-password" placeholder="ADMIN_KEY"><label for="data">Vacante(s) en formato JSON</label><textarea id="data" spellcheck="false" placeholder='[{"title":"Diseñador UX","company":"Empresa","place":"México · Remoto","mode":"Remoto","salary":"$40,000 MXN","fit":75,"skills":["Figma","Accesibilidad"],"missing":["Accesibilidad"],"source":"Feed autorizado","verified":true,"desc":"Requisitos del puesto","url":"https://empresa.example/jobs/123"}]'></textarea><div class="hint">Campos obligatorios: <code>title</code>, <code>company</code>. Habilidades, fuente, salario, URL y compatibilidad son opcionales.</div><button id="send">Guardar vacantes</button><div id="msg" class="msg"></div></main><script>const key=document.querySelector('#key'),msg=document.querySelector('#msg');key.value=sessionStorage.getItem('adminKey')||'';document.querySelector('#send').onclick=async()=>{msg.className='msg';try{const payload=JSON.parse(document.querySelector('#data').value);const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key.value},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudieron guardar las vacantes');sessionStorage.setItem('adminKey',key.value);msg.textContent=`Listo: ${d.saved} vacante(s) guardadas. Las coincidencias se actualizaron para evitar duplicados.`;msg.className='msg ok'}catch(e){msg.textContent=e.message;msg.className='msg err'}};</script></html>
